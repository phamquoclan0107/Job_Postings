# ============================================================
#  Spring Application
# ============================================================
spring.application.name=jobapp

# ============================================================
#  Database - MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/job_db?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================
#  JWT
# ============================================================
jwt.secret=Hy7kP2mN9qR4sT6uW8xZ0aB3cD5eF7gH9iJ1kL3mN5oP7qR9sT1uV3wX5yZ7aB=
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ============================================================
#  File Upload - VPS local path
# ============================================================
upload.base-dir=/var/www/uploads
upload.jobs-dir=/var/www/uploads/jobs
upload.products-dir=/var/www/uploads/products
upload.base-url=http://yourdomain.com/uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ============================================================
#  Server
# ============================================================
server.port=8080

# ============================================================
#  Logging
# ============================================================
logging.level.com.example.jobapp=INFO
logging.level.org.springframework.security=WARN